name: گزارش اشکال در کد
description: کدِ یک فصل کار نمی‌کند یا با متن فصل نمی‌خواند
labels: [bug]
body:
  - type: input
    id: folder
    attributes:
      label: کدام پوشه؟
      placeholder: مثلاً term-1-foundations/session-05-first-code-blink
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: چه انتظاری داشتی؟
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: چه دیدی؟ (پیام خطا را کامل بچسبان)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: کجا اجرا کردی؟
      placeholder: برد واقعی ESP32، شبیه‌ساز یادستان، Google Colab، …
